  --head-h:0px;
  color-scheme:light;
}
[data-theme="dark"]{
  --bg:#14161C; --surface:#1E222B; --ink:#E9ECF1; --muted:#9CA3B0; --line:#2E3340;
  color-scheme:dark;
}
*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{margin:0; background:var(--bg); color:var(--ink); font-family:var(--font); font-size:16px; line-height:1.4; -webkit-tap-highlight-color:transparent}
button,input,select,textarea{font:inherit; color:inherit}
button{cursor:pointer}
:focus-visible{outline:2px solid var(--q2); outline-offset:2px; border-radius:6px}
.sr-only{position:absolute; width:1px; height:1px; overflow:hidden; clip:rect(0 0 0 0); white-space:nowrap}

.app{max-width:1320px; margin:0 auto; padding:18px 24px 120px; padding-left:max(24px, env(safe-area-inset-left)); padding-right:max(24px, env(safe-area-inset-right))}

/* ---------- En-tête ---------- */
.top{position:relative; z-index:5}
.titlebar{display:flex; align-items:center; gap:12px; margin-bottom:12px}
h1{margin:0; font-size:30px; font-weight:700; letter-spacing:-.025em; line-height:1.1}
.today{color:var(--muted); font-size:15px; margin-left:4px}
.newtask{margin-left:auto; display:flex; align-items:center; gap:6px; padding:9px 16px 9px 12px}
.newtask svg{width:18px; height:18px}
.newtask + .iconbtn{margin-left:0}
.iconbtn{margin-left:auto; width:42px; height:42px; display:grid; place-items:center; border:1px solid var(--line); background:var(--surface); border-radius:12px; color:var(--ink)}
.iconbtn svg{width:20px; height:20px}
.syncbtn{display:none; align-items:center; gap:7px; border:1px solid var(--line); background:var(--surface); border-radius:12px; height:42px; padding:0 12px; font-weight:600; font-size:14px; color:var(--muted)}
.syncbtn.on{display:flex}
.syncbtn svg{width:19px; height:19px}
.syncbtn i{width:8px; height:8px; border-radius:50%; background:var(--muted)}
.syncbtn[data-s="ok"] i{background:#1F9D55} .syncbtn[data-s="syncing"] i,.syncbtn[data-s="connecting"] i{background:#D08A0E} .syncbtn[data-s="offline"] i,.syncbtn[data-s="error"] i,.syncbtn[data-s="unavailable"] i{background:#C0262F}
.syncbtn[data-s="signedout"]{color:var(--ink)}
.syncbox{background:var(--bg); border-radius:12px; padding:12px; margin-top:6px}
.syncbox .row-actions{margin-top:12px}
.syncstate{display:flex; align-items:center; gap:8px; font-size:14px; margin:0}
.syncstate i{width:9px; height:9px; border-radius:50%; flex:none}
.authform .field{margin:10px 0}

.tabbar{display:flex; align-items:center; gap:6px; margin:0 -4px 14px}
.tabs{flex:1; min-width:0; display:flex; align-items:center; gap:4px; overflow-x:auto; scrollbar-width:none; padding:4px; -webkit-overflow-scrolling:touch; scroll-behavior:smooth}
.tabs::-webkit-scrollbar{display:none}
.tab{flex:none; display:flex; align-items:center; gap:7px; border:0; background:transparent; padding:8px 14px; border-radius:999px; font-weight:600; color:var(--muted); white-space:nowrap}
.tab:hover{color:var(--ink)}
.tab[aria-selected="true"]{background:var(--ink); color:var(--bg)}
.tab .dot{width:10px; height:10px; border-radius:50%; box-shadow:inset 0 -2px 0 rgba(0,0,0,.18)}
.tab .n{font-weight:500; font-size:13px; opacity:.75; font-variant-numeric:tabular-nums}
.tab.add{flex:none; width:36px; height:36px; padding:0; justify-content:center; border:1.5px dashed var(--line); color:var(--muted)}
.tabs.fade-r{-webkit-mask-image:linear-gradient(to right,#000 calc(100% - 28px),transparent); mask-image:linear-gradient(to right,#000 calc(100% - 28px),transparent)}
.tabs.fade-l{-webkit-mask-image:linear-gradient(to left,#000 calc(100% - 28px),transparent); mask-image:linear-gradient(to left,#000 calc(100% - 28px),transparent)}
.tabs.fade-l.fade-r{-webkit-mask-image:linear-gradient(to right,transparent,#000 28px,#000 calc(100% - 28px),transparent); mask-image:linear-gradient(to right,transparent,#000 28px,#000 calc(100% - 28px),transparent)}
.tab.add:hover{border-color:var(--muted)}
.tab.add svg{width:16px; height:16px}
.tab.all{flex:none; margin-right:4px; position:relative; border:1px solid var(--line)}
.tab.all[aria-selected="true"]{border-color:var(--ink)}
.tab-edit{flex:none; width:32px; height:32px; margin-left:-2px; border:0; border-radius:50%; background:transparent; color:var(--muted); display:grid; place-items:center; padding:0}
.tab-edit:hover{background:var(--surface); color:var(--ink)}
.tab-edit svg{width:15px; height:15px}

.mini{display:none}
.mini-cell{--qc:var(--q1); border:0; display:flex; align-items:center; gap:6px; padding:5px 10px; border-radius:9px; background:color-mix(in srgb, var(--qc) 14%, var(--surface)); font-weight:600; font-size:13px; color:var(--ink); text-align:left; min-height:32px}
.mini-cell b{color:var(--qc); white-space:nowrap; overflow:hidden; text-overflow:ellipsis}
.mini-cell span{margin-left:auto; font-variant-numeric:tabular-nums; color:var(--muted)}
.mini-cell.over{box-shadow:inset 0 0 0 2px var(--qc)}
.mini-cell[data-q="q2"]{--qc:var(--q2)} .mini-cell[data-q="q3"]{--qc:var(--q3)} .mini-cell[data-q="q4"]{--qc:var(--q4)}

/* ---------- Tableau de liège ---------- */
.matrix{display:grid; grid-template-columns:30px minmax(0,1fr); grid-template-areas:". top" "left board"}
.ax-top{grid-area:top; display:grid; grid-template-columns:1fr 1fr; padding:0 14px 8px}
.ax-left{grid-area:left; display:grid; grid-template-rows:1fr 1fr; padding:14px 0}
.ax-top span,.ax-left span{color:var(--muted); font-weight:600; font-size:14px; display:flex; align-items:center; justify-content:center}
.ax-left span{writing-mode:vertical-rl; transform:rotate(180deg)}

.board{
  grid-area:board; display:grid; grid-template-columns:1fr 1fr; grid-template-rows:1fr 1fr;
  background:#BE8D5C var(--cork) repeat; background-size:400px 400px;
  border:12px solid #93643A; border-radius:14px;
  box-shadow:inset 0 0 0 1px rgba(0,0,0,.25), inset 0 8px 18px rgba(60,30,5,.35), inset 0 -2px 8px rgba(60,30,5,.2), 0 1px 0 #B98A5B, 0 14px 30px rgba(50,30,10,.22);
  position:relative;
}
.quad{--qc:var(--q1); position:relative; padding:20px 22px 18px; min-height:max(300px, calc((100vh - 250px) / 2)); display:flex; flex-direction:column; scroll-margin-top:calc(var(--head-h) + 12px); transition:background .15s}
.quad[data-q="q1"]{--qc:var(--q1); border-right:3px solid rgba(70,38,12,.42); border-bottom:3px solid rgba(70,38,12,.42)}
.quad[data-q="q2"]{--qc:var(--q2); border-bottom:3px solid rgba(70,38,12,.42)}
.quad[data-q="q3"]{--qc:var(--q3); border-right:3px solid rgba(70,38,12,.42)}
.quad[data-q="q4"]{--qc:var(--q4)}
.quad.over{background:rgba(255,248,230,.16); box-shadow:inset 0 0 0 3px color-mix(in srgb, var(--qc) 80%, #fff)}

/* étiquette de titre, sur papier, avec ruban adhésif */
.qhead{align-self:flex-start; position:relative; display:flex; align-items:center; gap:12px; background:#FFFDF6; padding:8px 14px 8px 14px; border-radius:3px; box-shadow:0 1px 1px rgba(0,0,0,.2), 0 5px 10px -3px rgba(40,20,0,.4); transform:rotate(-1.2deg); margin:4px 0 18px}
.quad[data-q="q2"] .qhead,.quad[data-q="q3"] .qhead{transform:rotate(1deg)}
.qhead::before{content:""; position:absolute; top:-9px; left:50%; width:64px; height:18px; margin-left:-32px; background:rgba(255,255,255,.55); box-shadow:0 1px 2px rgba(0,0,0,.12); transform:rotate(-3deg)}
.qname{margin:0; font-size:25px; font-weight:700; letter-spacing:-.02em; color:var(--qc); line-height:1.05}
.qsub{display:block; color:#6B6556; font-size:13px; font-weight:500; margin-top:2px}
.qcount{min-width:28px; height:28px; padding:0 8px; border-radius:14px; background:var(--qc); color:#fff; font-weight:700; font-size:14px; display:grid; place-items:center; font-variant-numeric:tabular-nums}
.qcount:empty{display:none}

/* ---------- Pense-bêtes ---------- */
.qlist{list-style:none; margin:0; padding:4px 0 6px; flex:1; display:grid; grid-template-columns:repeat(auto-fill, minmax(160px, 1fr)); gap:20px 16px; align-content:start; align-items:start; min-height:90px}
.qlist:empty::before{content:attr(data-empty); grid-column:1 / -1; color:rgba(255,250,238,.95); font-size:15px; font-weight:500; text-shadow:0 1px 3px rgba(40,18,0,.55); padding:10px 2px}

.note{
  --paper:#FFE97A; --rot:0deg; --pin:#6D4AFF;
  position:relative; background:var(--paper); color:var(--paper-ink);
  min-height:118px; padding:20px 12px 12px; display:flex; flex-direction:column;
  border-radius:2px 2px 4px 2px; border-bottom-right-radius:22px 8px;
  box-shadow:0 1px 1px rgba(0,0,0,.16), 0 8px 12px -6px rgba(40,18,0,.55), inset 0 -10px 18px -12px rgba(0,0,0,.18);
  transform:rotate(var(--rot)); transition:transform .12s, box-shadow .12s;
  user-select:none; -webkit-user-select:none; -webkit-touch-callout:none; cursor:grab; touch-action:manipulation;
}
.note:hover{transform:rotate(var(--rot)) translateY(-2px); box-shadow:0 1px 1px rgba(0,0,0,.16), 0 12px 16px -6px rgba(40,18,0,.55), inset 0 -10px 18px -12px rgba(0,0,0,.18)}
.pin{position:absolute; top:5px; left:50%; width:14px; height:14px; margin-left:-7px; border-radius:50%; background:radial-gradient(circle at 35% 30%, rgba(255,255,255,.75) 0 2px, transparent 3px), var(--pin); box-shadow:0 2px 2px rgba(0,0,0,.35), inset 0 -2px 3px rgba(0,0,0,.25)}
.ntop{display:flex; align-items:flex-start; gap:8px}
.check{position:relative; flex:none; width:24px; height:24px; margin-top:0; border-radius:50%; border:2px solid color-mix(in srgb, var(--paper-ink) 60%, transparent); background:color-mix(in srgb, var(--paper) 60%, #fff 40%); padding:0; display:grid; place-items:center; cursor:pointer}
.check::after{content:""; position:absolute; inset:-12px}
.check svg{width:12px; height:12px; opacity:0; color:var(--paper-ink)}
.check:hover svg{opacity:.45}
.check[aria-checked="true"]{background:var(--paper-ink); border-color:var(--paper-ink)}
.check[aria-checked="true"] svg{opacity:1; color:var(--paper)}
.nbody{flex:1; min-width:0; border:0; background:none; padding:0; text-align:left; color:inherit; cursor:inherit; border-radius:4px}
.ntitle{display:block; font-family:var(--hand); font-size:20px; line-height:1.12; overflow-wrap:anywhere}
.meta{display:flex; flex-wrap:wrap; gap:4px 9px; margin-top:auto; padding-top:10px; font-size:12.5px; color:color-mix(in srgb, var(--paper-ink) 80%, transparent); align-items:center}
.meta:empty{display:none}
.meta span{display:inline-flex; align-items:center; gap:4px}
.meta svg{width:13px; height:13px}
.lvl b{display:inline-grid; place-items:center; min-width:18px; height:18px; padding:0 4px; border-radius:9px; background:var(--paper-ink); color:var(--paper); font-size:11px; font-weight:700}
.due.late{color:#A8201A; font-weight:700}
.due.today{color:var(--paper-ink); font-weight:700}
.auto{color:color-mix(in srgb, var(--qc) 75%, #000); font-weight:700}
.note.darkpaper .due.late{color:#FFB4A9}
.note.darkpaper .auto{color:color-mix(in srgb, var(--qc) 45%, #fff)}
.forced{font-style:italic}
.tag{font-weight:600}
.ndel{position:absolute; top:4px; right:4px; width:34px; height:34px; border-radius:50%; border:0; background:var(--paper-ink); color:var(--paper); display:grid; place-items:center; padding:0}
.ndel::after{content:""; position:absolute; inset:-5px}
.ndel svg{width:16px; height:16px}
.note.done{cursor:default; filter:saturate(.55); opacity:.7}
.note.done .ntitle{text-decoration:line-through; text-decoration-thickness:2px}
.note.done .meta{opacity:.7}
.note.done .ntitle{padding-right:30px}

.qadd{display:flex; gap:6px; align-items:center; margin-top:16px; background:rgba(255,253,246,.92); padding:4px 4px 4px 12px; border-radius:6px; box-shadow:0 1px 1px rgba(0,0,0,.15), 0 4px 10px -4px rgba(40,18,0,.45)}
.qadd input{flex:1; min-width:0; border:0; background:transparent; padding:8px 0; font-size:15px; color:#2B2416}
.qadd input:focus{outline:none}
.qadd:focus-within{box-shadow:0 0 0 2px var(--qc), 0 4px 10px -4px rgba(40,18,0,.45)}
.qadd input::placeholder{color:#7A7262}
.qadd select{border:1px solid #DDD5C6; background:#fff; color:#2B2416; border-radius:8px; padding:6px; font-size:13px; max-width:110px}
.qadd button{border:0; width:34px; height:34px; border-radius:6px; background:var(--qc); color:#fff; display:grid; place-items:center; flex:none}
.qadd button svg{width:16px; height:16px}

.below{display:flex; justify-content:flex-end; margin-top:12px}
.clear{border:0; background:none; color:var(--muted); font-weight:600; padding:6px 2px; text-decoration:underline; text-underline-offset:3px}

/* ---------- Glisser-déposer ---------- */
body.dragging{user-select:none; -webkit-user-select:none; cursor:grabbing}
body.dragging .note:hover{transform:rotate(var(--rot))}
.note.placeholder{opacity:.28; filter:grayscale(.5)}
.ghost{position:fixed !important; z-index:100; pointer-events:none; margin:0; list-style:none; transform:rotate(calc(var(--rot) + 3deg)) scale(1.05) !important; box-shadow:0 2px 2px rgba(0,0,0,.18), 0 24px 30px -10px rgba(40,18,0,.6) !important; cursor:grabbing}

/* ---------- Bouton nouvelle tâche ---------- */
.fab.hide{transform:translateY(120px)}
@media (min-width:761px){ .fab{display:none !important} }
.fab{transition:transform .2s; position:fixed; right:max(22px, env(safe-area-inset-right)); bottom:max(22px, env(safe-area-inset-bottom)); z-index:20; display:flex; align-items:center; gap:8px; border:0; background:var(--ink); color:var(--bg); font-weight:600; padding:0 20px 0 16px; height:54px; border-radius:27px; box-shadow:0 8px 24px rgba(23,32,51,.3)}
.fab svg{width:20px; height:20px}

/* ---------- Fenêtres ---------- */
dialog{border:0; padding:0; background:var(--surface); color:var(--ink); border-radius:20px; width:min(580px, calc(100vw - 32px)); max-height:min(88vh, 900px); box-shadow:0 30px 80px rgba(0,0,0,.3)}
dialog::backdrop{background:rgba(20,16,10,.5)}
dialog[open]{animation:pop .18s ease-out}
@keyframes pop{from{opacity:0; transform:translateY(12px)}}
.dlg{display:flex; flex-direction:column; max-height:inherit}
.dlg-head{display:flex; align-items:center; gap:10px; padding:18px 20px 8px}
.dlg-head h2{margin:0; font-size:21px; letter-spacing:-.015em}
.dlg-head .iconbtn{width:36px; height:36px; border-radius:10px}
.dlg-body{padding:6px 20px 16px; overflow:auto}
.dlg-preview{padding:0 20px 2px}
.dlg-preview .preview{margin:8px 0 6px}
.dlg-foot{display:flex; gap:8px; padding:12px 20px 18px; border-top:1px solid var(--line); padding-bottom:max(18px, env(safe-area-inset-bottom))}
.dlg-foot .spacer{flex:1}
.btn{border:1px solid var(--line); background:var(--surface); border-radius:12px; padding:10px 16px; font-weight:600}
.btn.primary{background:var(--ink); color:var(--bg); border-color:var(--ink)}
.btn.danger{color:#C0262F; border-color:color-mix(in srgb, #C0262F 35%, var(--line))}
.btn.small{padding:7px 12px; font-size:14px; border-radius:10px}
.linkbtn{border:0; background:none; padding:0; color:var(--q2); font-weight:600; text-decoration:underline; text-underline-offset:3px; font-size:inherit}

.field{display:block; margin:14px 0}
.field > span,.flabel{display:block; font-size:14px; font-weight:600; margin-bottom:6px}
.field input[type="text"],.field input[type="date"],.field select,.field textarea,.input{width:100%; border:1px solid var(--line); background:var(--bg); border-radius:12px; padding:11px 12px; font-size:16px}
.field textarea{min-height:70px; resize:vertical}
.ttl-input{font-size:19px !important; font-weight:600}
.help{color:var(--muted); font-size:13.5px; margin:8px 0 0}

.switches{display:grid; grid-template-columns:1fr; gap:10px; margin:14px 0}
.switch{display:flex; align-items:center; gap:10px; border:1px solid var(--line); border-radius:12px; padding:10px 12px; cursor:pointer}
.switch input{appearance:none; -webkit-appearance:none; flex:none; width:40px; height:24px; border-radius:12px; background:var(--line); position:relative; margin:0; cursor:pointer; transition:background .15s}
.switch input::after{content:""; position:absolute; top:3px; left:3px; width:18px; height:18px; border-radius:50%; background:#fff; transition:transform .15s; box-shadow:0 1px 3px rgba(0,0,0,.25)}
.switch input:checked{background:var(--ink)}
.switch input:checked::after{transform:translateX(16px)}
.switch span{font-weight:600; font-size:15px}
.urgseg{margin-top:4px}
.err{color:#C0262F; font-size:13.5px; margin:6px 0 0; font-weight:600}
.err:empty{display:none}
input[aria-invalid="true"]{border-color:#C0262F !important; box-shadow:0 0 0 1px #C0262F}
.qadd.err{box-shadow:0 0 0 2px #C0262F, 0 4px 10px -4px rgba(40,18,0,.45); animation:shake .3s}
@keyframes shake{25%{transform:translateX(-4px)}75%{transform:translateX(4px)}}

.chips{display:flex; flex-wrap:wrap; gap:6px}
.chips label{position:relative}
.chips input{position:absolute; opacity:0; inset:0; margin:0; cursor:pointer}
.chips span{display:inline-flex; align-items:center; gap:7px; border:1px solid var(--line); border-radius:8px; padding:7px 12px 7px 8px; font-size:14px; background:var(--bg)}
.chips i{width:16px; height:16px; border-radius:3px; background:var(--c); box-shadow:inset 0 0 0 1px rgba(0,0,0,.12)}
.chips b{font-size:12px}
.chips input:checked + span{background:var(--ink); color:var(--bg); border-color:var(--ink)}
.chips input:focus-visible + span{outline:2px solid var(--q2); outline-offset:2px}

.daterow{display:flex; gap:8px; align-items:center; flex-wrap:wrap}
.daterow input{flex:1 1 170px; width:auto !important}
.daterow .btn{padding:8px 12px; font-size:14px}

.preview{display:flex; align-items:center; gap:12px; background:var(--bg); border-radius:12px; padding:12px; margin-top:16px}
.pgrid{display:grid; grid-template-columns:repeat(2,16px); gap:3px; flex:none}
.pgrid i{width:16px; height:16px; border-radius:4px; background:var(--line)}
.pgrid i.on{background:var(--qc)}
.ptext{font-size:14px}
.ptext strong{color:var(--qc)}

/* Réglages */
.set h3{margin:24px 0 6px; font-size:16px}
.set section:first-child h3{margin-top:6px}
.seg{display:flex; background:var(--bg); border-radius:12px; padding:4px; gap:4px}
.seg label{flex:1; position:relative}
.seg input{position:absolute; opacity:0; inset:0; margin:0; cursor:pointer}
.seg span{display:block; text-align:center; padding:8px; border-radius:9px; font-weight:600; font-size:14px; color:var(--muted)}
.seg input:checked + span{background:var(--surface); color:var(--ink); box-shadow:0 1px 3px rgba(0,0,0,.12)}
.seg input:focus-visible + span{outline:2px solid var(--q2)}
.qrow,.lrow,.srow,.shead{display:grid; gap:8px; align-items:center; margin:8px 0}
.qrow{grid-template-columns:42px 1fr 1.4fr}
.lrow{grid-template-columns:42px 1fr 38px}
.srow,.shead{grid-template-columns:30px 42px minmax(0,1fr) 100px 38px}
.shead{font-size:12.5px; color:var(--muted); margin:12px 0 0}
.srow .num{display:grid; place-items:center; width:28px; height:28px; border-radius:14px; background:var(--ink); color:var(--bg); font-size:13px; font-weight:700}
.srow .num.none{background:var(--line); color:var(--ink); font-size:11px}
.input{padding:9px 10px; font-size:15px}
input[type="color"]{width:42px; height:40px; border:1px solid var(--line); border-radius:10px; padding:3px; background:var(--bg); cursor:pointer}
.del{width:38px; height:38px; border:1px solid var(--line); border-radius:10px; background:var(--bg); display:grid; place-items:center; color:var(--muted)}
.del svg{width:16px; height:16px}
.row-actions{display:flex; flex-wrap:wrap; gap:8px; margin-top:10px}
.leadwrap{position:relative; display:flex; align-items:center; gap:6px}
.leadwrap .input{padding-right:8px}
.leadwrap em{font-style:normal; color:var(--muted); font-size:13px; white-space:nowrap}
.example{background:var(--bg); border-radius:10px; padding:10px 12px; font-size:14px; margin-top:6px}
.swatches{display:flex; flex-wrap:wrap; gap:8px}
.swatches label{position:relative}
.swatches input{position:absolute; opacity:0; inset:0; margin:0; cursor:pointer}
.swatches span{display:block; width:34px; height:34px; border-radius:50%; background:var(--c); box-shadow:inset 0 -3px 0 rgba(0,0,0,.2)}
.swatches input:checked + span{outline:3px solid var(--ink); outline-offset:2px}
.swatches input:focus-visible + span{outline:3px solid var(--q2); outline-offset:2px}

/* Toast */
.toast{inset:auto; margin:0; border:0; overflow:visible; position:fixed; left:50%; top:18px; transform:translateX(-50%) translateY(-16px); opacity:0; pointer-events:none; z-index:200; background:var(--ink); color:var(--bg); padding:11px 14px 11px 16px; border-radius:14px; display:flex; align-items:center; gap:14px; max-width:calc(100vw - 32px); font-size:14.5px; transition:opacity .18s, transform .18s; box-shadow:0 10px 30px rgba(0,0,0,.25)}
.toast:not(:popover-open):not(.nopop){display:none}
.toast.show{opacity:1; transform:translateX(-50%); pointer-events:auto}
.toast button{border:0; background:none; color:var(--bg); font-weight:700; text-decoration:underline; padding:2px 4px}

/* ---------- Mobile ---------- */
@media (max-width:760px){
  .app{padding:0 12px 120px}
  .top{padding:max(12px, env(safe-area-inset-top)) 0 4px}
  .stick{position:sticky; top:0; z-index:30; background:var(--bg); margin:0 -12px; padding:max(6px, env(safe-area-inset-top)) 12px 8px; border-bottom:1px solid var(--line)}
  .newtask{display:none}
  .newtask + .iconbtn{margin-left:auto}
  .syncbtn{height:40px; padding:0 10px} .syncbtn .lbl{display:none}
  .syncbtn.on ~ .iconbtn, .syncbtn.on + .iconbtn{margin-left:0}
  .syncbtn.on{margin-left:auto}
  .titlebar{margin-bottom:8px}
  h1{font-size:24px}
  .today{display:none}
  .tabbar{margin:0 -4px 6px}
  .tab{min-height:40px}
  .tab.add{width:40px; height:40px}
  .tab-edit{width:40px; height:40px}
  .qadd input,.qadd select,.field input[type="text"],.field input[type="date"],.field select,.field textarea,.input{font-size:16px}
  .qadd button{width:42px; height:42px}
  .toast{top:calc(var(--head-h) + 10px); bottom:auto; transform:translateX(-50%) translateY(-16px)}
  .toast.show{transform:translateX(-50%)}
  .mini{display:grid; grid-template-columns:1fr 1fr; gap:4px}
  .matrix{display:block; margin-top:14px}
  .ax-top,.ax-left{display:none}
  .board{display:block; border-width:8px; border-radius:12px; margin:0 -4px}
  .quad{min-height:0; border-right:0 !important; border-bottom:3px solid rgba(70,38,12,.42); padding:16px 14px 16px}
  .quad[data-q="q4"]{border-bottom:0}
  .qname{font-size:22px}
  .qlist{grid-template-columns:1fr 1fr; gap:16px 12px}
  .note{min-height:110px; padding:20px 10px 10px}
  .ntitle{font-size:19px}
  .fab{padding:0; width:58px; justify-content:center; border-radius:50%}
  .fab .lbl{display:none}
  dialog{width:100vw; max-width:100vw; margin:auto 0 0; border-radius:20px 20px 0 0; max-height:92vh}
  dialog[open]{animation:sheet .22s ease-out}
  @keyframes sheet{from{transform:translateY(40px); opacity:.4}}
  .switches{grid-template-columns:1fr}
  .qrow{grid-template-columns:42px 1fr}
  .qrow .sub{grid-column:2}
  .srow,.shead{grid-template-columns:28px 42px minmax(0,1fr) 84px 38px; gap:6px}
}
@media (max-width:360px){ .qlist{grid-template-columns:1fr} }
@media (max-height:500px) and (pointer:coarse){
  .app{padding-top:8px}
  h1{font-size:21px} .today{display:none} .titlebar{margin-bottom:4px} .iconbtn{width:38px; height:38px}
  .tabbar{margin-bottom:6px} .ax-top{display:none}
  .mini{display:grid; grid-template-columns:repeat(4,1fr); gap:4px; margin:0 0 8px} .newtask{display:none} .newtask + .iconbtn{margin-left:auto}
  .fab{display:flex !important} .matrix{grid-template-areas:"left board" "left board"}
  .quad{min-height:0}
  .fab{height:48px; padding:0; width:48px; justify-content:center; border-radius:50%} .fab .lbl{display:none}
  .qadd input,.qadd select,.field input,.field select,.field textarea,.input{font-size:16px}
}
[data-theme="dark"] .ptext strong,[data-theme="dark"] .mini-cell b{color:color-mix(in srgb, var(--qc) 72%, #fff)}
.top .titlebar .iconbtn,.top .titlebar .newtask,.top .titlebar .syncbtn{margin-left:0}
.top .titlebar .today{margin-right:auto}
@media (max-width:760px){ .top .titlebar h1{margin-right:auto} }
@media (max-height:500px) and (pointer:coarse){ .top .titlebar h1{margin-right:auto} }
@media (prefers-reduced-motion:reduce){ *{animation:none !important; transition:none !important} }
</style>
</head>
<body>
<div class="app">
  <header class="top" id="top">
    <div class="titlebar">
      <h1 id="appTitle">Mes priorités</h1>
      <span class="today" id="today"></span>
      <button class="btn primary newtask" id="newTaskTop"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round"><path d="M12 5v14M5 12h14"/></svg>Nouvelle tâche</button>
      <button class="syncbtn" id="syncBtn" data-s="off" title="Synchronisation"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M7 18a4.5 4.5 0 0 1-.6-8.96A6 6 0 0 1 18 9.5a4 4 0 0 1-.5 8.5z"/></svg><i></i><span class="lbl" id="syncLbl"></span></button>
      <button class="iconbtn" id="openSettings" aria-label="Réglages" title="Réglages">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M4 7h10M18 7h2M4 17h4M12 17h8"/><circle cx="16" cy="7" r="2"/><circle cx="10" cy="17" r="2"/></svg>
      </button>
    </div>
  </header>
  <div class="stick" id="stick">
    <div class="tabbar"><nav class="tabs" id="tabs" aria-label="Onglets"></nav><button class="tab add" id="addList" aria-label="Nouvel onglet" title="Nouvel onglet"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round"><path d="M12 5v14M5 12h14"/></svg></button><button class="tab all" id="allTab" data-view="all"></button></div>
    <div class="mini" id="mini" aria-label="Aller à une case"></div>
  </div>

  <main>
    <div class="matrix">
      <div class="ax-top" aria-hidden="true"><span>Urgent</span><span>Pas urgent</span></div>
      <div class="ax-left" aria-hidden="true"><span>Important</span><span>Pas important</span></div>
      <div class="board" id="board"></div>
    </div>
    <div class="below" id="below"></div>
  </main>
</div>

<button class="fab" id="fab" aria-label="Nouvelle tâche">
  <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round"><path d="M12 5v14M5 12h14"/></svg>
  <span class="lbl">Nouvelle tâche</span>
</button>

<!-- Fenêtre tâche -->
<dialog id="taskDialog" aria-labelledby="taskDlgTitle">
  <form class="dlg" id="taskForm" method="dialog" novalidate>
    <div class="dlg-head">
      <h2 id="taskDlgTitle">Nouvelle tâche</h2>
      <button type="button" class="iconbtn" data-close aria-label="Fermer"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M6 6l12 12M18 6L6 18"/></svg></button>
    </div>
    <div class="dlg-body">
      <label class="field"><span class="sr-only">Titre</span><input type="text" name="ttl" class="ttl-input" placeholder="Que faut-il faire ?" autocomplete="off" required></label><p class="err" id="ttlErr"></p>
      <label class="field" id="listField"><span>Onglet</span><select name="list"></select></label>
      <div class="switches">
        <label class="switch"><input type="checkbox" name="imp"><span>Importante</span></label>
      </div>
      <div class="field"><span class="flabel">Urgence</span>
        <div class="seg urgseg" role="radiogroup" aria-label="Urgence">
          <label><input type="radio" name="urg" value="auto"><span>Automatique</span></label>
          <label><input type="radio" name="urg" value="on"><span>Urgente</span></label>
          <label><input type="radio" name="urg" value="off"><span>Pas urgente</span></label>
        </div></div>
      <div class="field"><span class="flabel">Temps nécessaire</span><div class="chips" id="lvlChips"></div>
        <p class="help"><span id="lvlHelp"></span> <button type="button" class="linkbtn" id="editLeads">Modifier les délais</button></p></div>
      <div class="field"><span class="flabel">Échéance</span>
        <div class="daterow">
          <input type="date" name="due" class="input" aria-label="Date d'échéance" min="2000-01-01" max="2099-12-31">
          <button type="button" class="btn" data-due="0">Aujourd’hui</button>
          <button type="button" class="btn" data-due="1">Demain</button>
          <button type="button" class="btn" data-due="7">Dans 7 j</button>
          <button type="button" class="btn" data-due="">Aucune</button>
        </div>
        <p class="err" id="dueErr"></p>
      </div>
      <label class="field"><span>Détails</span><textarea name="notes" placeholder="Facultatif"></textarea></label>
    </div>
    <div class="dlg-preview"><div class="preview" id="preview"></div></div>
    <div class="dlg-foot">
      <button type="button" class="btn danger" id="delTask">Supprimer</button>
      <span class="spacer"></span>
      <button type="button" class="btn" data-close>Annuler</button>
      <button type="submit" class="btn primary" id="saveTask">Enregistrer</button>
    </div>
  </form>
</dialog>

<!-- Fenêtre nouvel onglet -->
<dialog id="listDialog" aria-labelledby="listDlgTitle">
  <form class="dlg" id="listForm" method="dialog" novalidate>
    <div class="dlg-head">
      <h2 id="listDlgTitle">Nouvel onglet</h2>
      <button type="button" class="iconbtn" data-close aria-label="Fermer"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M6 6l12 12M18 6L6 18"/></svg></button>
    </div>
    <div class="dlg-body">
      <label class="field"><span>Nom</span><input type="text" name="lname" class="input" placeholder="Études, Association, Maison…" autocomplete="off" maxlength="40"></label><p class="err" id="listErr"></p>
      <div class="field"><span class="flabel">Couleur de la punaise</span><div class="swatches" id="listSwatches"></div></div>
    </div>
    <div class="dlg-foot"><button type="button" class="btn danger" id="delList">Supprimer l’onglet</button><span class="spacer"></span><button type="button" class="btn" data-close>Annuler</button><button type="submit" class="btn primary" id="saveList">Créer l’onglet</button></div>
  </form>
</dialog>

<!-- Fenêtre réglages -->
<dialog id="settingsDialog" aria-labelledby="setDlgTitle">
  <div class="dlg">
    <div class="dlg-head">
      <h2 id="setDlgTitle">Réglages</h2>
      <button type="button" class="iconbtn" data-close aria-label="Fermer"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M6 6l12 12M18 6L6 18"/></svg></button>
    </div>
    <div class="dlg-body set" id="settingsBody"></div>
  </div>
</dialog>

<!-- Confirmation -->
<dialog id="confirmDialog">
  <div class="dlg">
    <div class="dlg-body" style="padding-top:22px"><p id="confirmMsg" style="margin:0; font-size:16px"></p></div>

<div class="toast" id="toast" role="status" aria-live="polite" popover="manual"><span id="toastMsg"></span><button id="toastAct" hidden>Annuler</button></div>

<script>
(() => {
'use strict';

/* ================= Données ================= */
const KEY = 'matrice-eisenhower.v1';
/* Synchronisation : configuration Firebase du projet (null = pas de synchronisation, l'outil reste 100 % local) */
const FIREBASE_CONFIG = {apiKey:"AIzaSyAmMEYVKiz24az8XfI5j-7Iub5SH-08jEU", authDomain:"matrice-eisenhower-bf08f.firebaseapp.com", projectId:"matrice-eisenhower-bf08f", storageBucket:"matrice-eisenhower-bf08f.firebasestorage.app", messagingSenderId:"938946083999", appId:"1:938946083999:web:7d7244c266464aae9d76aa"};
const FB_VER = '13.2.0';
const QS = ['q1','q2','q3','q4'];
const uid = () => Math.random().toString(36).slice(2, 9) + Date.now().toString(36).slice(-4);
const clone = o => JSON.parse(JSON.stringify(o));
const NOTE_COLORS = ['#FFE97A','#C3EBA0','#AEDDF7','#FFC2DA','#FFC98F','#D9C8F5','#B8EDE3'];
const DEFAULT_SCALE = [
  {label:'10 min', lead:1, color:NOTE_COLORS[0]}, {label:'30 min', lead:2, color:NOTE_COLORS[1]},
  {label:'1 h', lead:3, color:NOTE_COLORS[2]}, {label:'2 h', lead:4, color:NOTE_COLORS[3]},
  {label:'Demi-journée ou plus', lead:5, color:NOTE_COLORS[4]}
];
const DEFAULT_Q = {
  q1:{name:'Faire',          sub:'Important et urgent',                           color:'#D7263D'},
  q2:{name:'Planifier',      sub:'Important, pas urgent',                         color:'#2B59C3'},
  q3:{name:'Expédier',       sub:'Urgent, pas important : faire vite',            color:'#D08A0E'},
  q4:{name:'Mettre de côté', sub:'Ni urgent ni important : si le temps le permet', color:'#6F7A8C'}
};
const EMPTY = {
  q1:'Rien d’urgent et important pour l’instant.',
  q2:'Épinglez ici ce qui compte sans presser.',
  q3:'Ce qui presse sans compter : à faire vite, ou à confier si possible.',
  q4:'Ce qui peut attendre qu’il reste du temps.'
};
const LIST_COLORS = ['#6D4AFF','#12A37F','#E4572E','#0E9AA7','#C2185B','#2B59C3','#8D6E63','#222831'];

function defaults(){
  return {
    version:3, title:'Mes priorités', deleted:{}, deletedLists:{}, sharedAt:0,
    lists:[{id:'pro', name:'Pro', color:'#6D4AFF'}, {id:'perso', name:'Perso', color:'#12A37F'}],
    tasks:[],
    settings:{theme:'auto', quadrants:clone(DEFAULT_Q), scale:DEFAULT_SCALE.map((s, i) => ({id:'n' + (i + 1), ...s})), noLevel:{lead:1, color:'#F6F0E0'}, view:'pro', lastList:'pro', tipShown:false}
  };
}
const isHex = c => /^#[0-9a-f]{6}$/i.test(c || '');
function normalize(raw){
  const d = defaults();
  if (!raw || typeof raw !== 'object') return d;
  const s = {...d, ...raw};
  const rs = raw.settings || {};
  s.settings = {...d.settings, ...rs};
  s.settings.quadrants = {};
  QS.forEach(q => s.settings.quadrants[q] = {...d.settings.quadrants[q], ...((rs.quadrants || {})[q] || {})});
  // anciens noms par défaut -> nouveaux (les noms choisis par l'utilisateur sont conservés)
  const OLD = {q3:['Déléguer','Urgent, pas important'], q4:['Éliminer','Ni urgent ni important']};
  Object.entries(OLD).forEach(([q, [n, sub]]) => { const c = s.settings.quadrants[q]; if (c.name === n) c.name = DEFAULT_Q[q].name; if (c.sub === sub) c.sub = DEFAULT_Q[q].sub; });
  if (!Array.isArray(s.settings.scale)) s.settings.scale = d.settings.scale;
  s.settings.scale = s.settings.scale.filter(l => l && l.id).map((l, i) => ({id:String(l.id), label:String(l.label ?? ''), lead:Math.max(0, parseInt(l.lead, 10) || 0), color:isHex(l.color) ? l.color : NOTE_COLORS[i % NOTE_COLORS.length]}));
  const nl = rs.noLevel || {};
  s.settings.noLevel = {lead: nl.lead === undefined ? d.settings.noLevel.lead : Math.max(0, parseInt(nl.lead, 10) || 0), color:isHex(nl.color) ? nl.color : d.settings.noLevel.color};
  if (!Array.isArray(s.lists) || !s.lists.length) s.lists = d.lists;
  s.lists = s.lists.filter(l => l && l.id).map(l => ({id:String(l.id), name:String(l.name ?? 'Onglet'), color:isHex(l.color) ? l.color : LIST_COLORS[0], updatedAt:+l.updatedAt || 0}));
  const ids = new Set(s.lists.map(l => l.id));
  s.tasks = (Array.isArray(s.tasks) ? s.tasks : []).filter(t => t && t.id && typeof t.title === 'string').map(t => ({
    id:String(t.id), listId: ids.has(t.listId) ? t.listId : s.lists[0].id, title:t.title, notes:String(t.notes || ''),
    important:!!t.important, urgency: ['auto','on','off'].includes(t.urgency) ? t.urgency : (t.manualUrgent ? 'on' : 'auto'), level:t.level ?? null,
    deadline: /^\d{4}-\d{2}-\d{2}$/.test(t.deadline || '') ? t.deadline : null,
    done:!!t.done, doneAt:t.doneAt || null, order: (raw.version || 1) < 3 ? (+t.gorder || 0) : (+t.order || 0), createdAt:t.createdAt || Date.now(),
    updatedAt:+t.updatedAt || 0
  }));
  s.tasks.sort((a, b) => (a.order - b.order) || (a.createdAt - b.createdAt) || (a.id < b.id ? -1 : a.id > b.id ? 1 : 0)).forEach((t, i) => t.order = i);
  if (s.settings.view !== 'all' && !ids.has(s.settings.view)) s.settings.view = s.lists[0].id;
  if (!ids.has(s.settings.lastList)) s.settings.lastList = s.lists[0].id;
  if (!['auto','light','dark'].includes(s.settings.theme)) s.settings.theme = 'auto';
  s.settings.tipShown = !!s.settings.tipShown;
  const cleanMap = m => { const o = {}; if (m && typeof m === 'object') Object.keys(m).forEach(k => { if (+m[k] > 0) o[k] = +m[k]; }); return o; };
  s.deleted = cleanMap(raw.deleted); s.deletedLists = cleanMap(raw.deletedLists); s.sharedAt = +raw.sharedAt || (Array.isArray(raw.tasks) && raw.tasks.length ? 1 : 0);   // un appareil déjà utilisé l'emporte sur un appareil vierge
  s.version = 3;
  return s;
}
function load(){
  try { return normalize(JSON.parse(localStorage.getItem(KEY) || 'null')); }
  catch(e){ return defaults(); }
}
let storageWarned = false;
function writeLocal(){
  try { localStorage.setItem(KEY, JSON.stringify(state)); }
  catch(e){
    if (!storageWarned){ storageWarned = true; toast('Sauvegarde impossible dans ce navigateur. Exportez vos tâches depuis les réglages pour ne pas les perdre.'); }
  }
}
/* Chaque enregistrement date ce qui a changé depuis le précédent (tâches, onglets, réglages partagés)
   et garde la trace des suppressions : c'est ce qui permet de fusionner proprement deux appareils. */
const sharedOf = st => ({title:st.title, quadrants:st.settings.quadrants, scale:st.settings.scale, noLevel:st.settings.noLevel});
const sansDate = o => { const {updatedAt, ...r} = o; return JSON.stringify(r); };
function stamp(){
  const now = Date.now(), prev = lastSaved;
  const pass = (cur, old, del) => {
    const pm = new Map(old.map(x => [x.id, x]));
    cur.forEach(x => { const p = pm.get(x.id); x.updatedAt = p && sansDate(p) === sansDate(x) ? (p.updatedAt || now) : now; delete del[x.id]; });
    const ids = new Set(cur.map(x => x.id));
    pm.forEach((p, id) => { if (!ids.has(id)) del[id] = now; });
  };
  pass(state.tasks, prev.tasks || [], state.deleted);
  pass(state.lists, prev.lists || [], state.deletedLists);
  state.sharedAt = prev.settings && JSON.stringify(sharedOf(prev)) === JSON.stringify(sharedOf(state)) ? (prev.sharedAt || 0) : now;
}
function save(){
  stamp();
  writeLocal();
  lastSaved = clone(state);
  schedulePush();
}
let state = load();
let lastSaved = clone(state);
/* Annuler : chaque action fournit sa propre remise en état, sans toucher à ce qui a été fait ensuite */
function offerUndo(msg, restore){
  toast(msg, () => { restore(); renumber(); save(); render(); if (typeof setDlg !== 'undefined' && setDlg.open) buildSettings(); });
}
const putBack = tasks => tasks.forEach(t => { if (!state.tasks.some(x => x.id === t.id)) state.tasks.push(t); });
const plural = (n, one, many) => n > 1 ? many : one;

/* ================= Dates & urgence ================= */
const pad = n => String(n).padStart(2, '0');
const ymd = d => d.getFullYear() + '-' + pad(d.getMonth() + 1) + '-' + pad(d.getDate());
const todayStr = () => ymd(new Date());
const parseYmd = s => { const [y, m, d] = s.split('-').map(Number); return new Date(y, m - 1, d); };
const addDays = (s, n) => { const d = parseYmd(s); d.setDate(d.getDate() + n); return ymd(d); };
const daysUntil = s => Math.round((parseYmd(s) - parseYmd(todayStr())) / 86400000);
const fmtDate = s => parseYmd(s).toLocaleDateString('fr-FR', {weekday:'short', day:'numeric', month:'short'});
const fmtShort = s => parseYmd(s).toLocaleDateString('fr-FR', Math.abs(daysUntil(s)) > 365 ? {day:'numeric', month:'short', year:'numeric'} : {day:'numeric', month:'short'});
const fmtDateLong = s => parseYmd(s).toLocaleDateString('fr-FR', Math.abs(daysUntil(s)) > 365 ? {weekday:'short', day:'numeric', month:'short', year:'numeric'} : {weekday:'short', day:'numeric', month:'short'});

const levelIdx = id => state.settings.scale.findIndex(l => l.id === id);
const leadOf = t => { const i = levelIdx(t.level); return i < 0 ? state.settings.noLevel.lead : state.settings.scale[i].lead; };
const paperOf = t => { const i = levelIdx(t.level); return i < 0 ? state.settings.noLevel.color : state.settings.scale[i].color; };
const autoUrgent = t => !!t.deadline && daysUntil(t.deadline) <= leadOf(t);
const isUrgent = t => t.urgency === 'on' || (t.urgency !== 'off' && autoUrgent(t));
const quadOf = t => { const u = isUrgent(t), i = t.important; return i && u ? 'q1' : i ? 'q2' : u ? 'q3' : 'q4'; };
const qName = q => state.settings.quadrants[q].name || DEFAULT_Q[q].name;
const jours = n => n + ' jour' + (Math.abs(n) > 1 ? 's' : '');

/* ================= Utilitaires ================= */
const $ = (s, r = document) => r.querySelector(s);
const $$ = (s, r = document) => [...r.querySelectorAll(s)];
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const find = id => state.tasks.find(t => t.id === id);
const listOf = id => state.lists.find(l => l.id === id) || state.lists[0];
const inView = t => state.settings.view === 'all' || t.listId === state.settings.view;
function sortedActive(){
  return state.tasks.filter(t => !t.done && inView(t)).sort((a, b) => (a.order - b.order) || (a.createdAt - b.createdAt) || (a.id < b.id ? -1 : a.id > b.id ? 1 : 0));
}
const renumber = () => state.tasks.slice().sort((a, b) => (a.order - b.order) || (a.createdAt - b.createdAt) || (a.id < b.id ? -1 : a.id > b.id ? 1 : 0)).forEach((t, i) => t.order = i);
function inkFor(hex){
  const n = parseInt(hex.slice(1), 16), c = [n >> 16, (n >> 8) & 255, n & 255].map(v => { v /= 255; return v <= .03928 ? v / 12.92 : Math.pow((v + .055) / 1.055, 2.4); });
  const L = .2126 * c[0] + .7152 * c[1] + .0722 * c[2];
  return L < .22 ? '#FFF6E6' : '#2B2416';
}
const maxOf = (arr, k) => arr.reduce((m, t) => Math.max(m, t[k]), -1);
const rotOf = id => { let h = 0; for (const c of id) h = (h * 31 + c.charCodeAt(0)) | 0; return ((Math.abs(h) % 41) - 20) / 10; }; // -2° à +2°

const ICON = {
  check:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3.4" stroke-linecap="round" stroke-linejoin="round"><path d="M5 12.5l4.5 4.5L19 7"/></svg>',
  cal:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"><rect x="3.5" y="5" width="17" height="15" rx="3"/><path d="M3.5 10h17M8 3v4M16 3v4"/></svg>',
  bolt:'<svg viewBox="0 0 24 24" fill="currentColor"><path d="M13.5 2 4 14h6.5L9.5 22 20 9.5h-6.6z"/></svg>',
  note:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"><path d="M5 6h14M5 12h14M5 18h9"/></svg>',
  plus:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round"><path d="M12 5v14M5 12h14"/></svg>',
  x:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round"><path d="M6 6l12 12M18 6L6 18"/></svg>',
  pencil:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M4 20h4L19 9l-4-4L4 16v4zM13.5 6.5l4 4"/></svg>',
  trash:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M4 7h16M10 11v6M14 11v6M6 7l1 13h10l1-13M9 7V4h6v3"/></svg>'
};

/* ================= Rendu ================= */
let renderPending = false;
function render(){
  if (drag){ renderPending = true; return; }
  applyTheme();
  $('#appTitle').textContent = state.title || 'Mes priorités';
  document.title = state.title || 'Mes priorités';
  $('#today').textContent = new Date().toLocaleDateString('fr-FR', {weekday:'long', day:'numeric', month:'long'});
  renderTabs(); renderBoard(); renderMini(); renderBelow();
  measureHead();
  if (!state.settings.tipShown && matchMedia('(pointer: coarse)').matches && $('.note:not(.done)')){
    state.settings.tipShown = true; save();
    setTimeout(() => toast('Astuce : appui long sur un pense-bête pour le déplacer dans une autre case.'), 600);
  }
}

function applyTheme(){
  const s = state.settings;
  const dark = s.theme === 'dark' || (s.theme === 'auto' && matchMedia('(prefers-color-scheme: dark)').matches);
  document.documentElement.dataset.theme = dark ? 'dark' : 'light';
  QS.forEach(q => document.documentElement.style.setProperty('--' + q, s.quadrants[q].color));
  $('meta[name="theme-color"]').setAttribute('content', dark ? '#14161C' : '#F3EEE6');
}

function renderTabs(){
  const v = state.settings.view;
  const count = id => state.tasks.filter(t => !t.done && (id === 'all' || t.listId === id)).length;
  const tabs = $('#tabs');
  tabs.innerHTML = state.lists.map(l =>
    `<button class="tab" data-view="${esc(l.id)}" aria-pressed="${v === l.id}" aria-selected="${v === l.id}"><i class="dot" style="background:${l.color}"></i>${esc(l.name)}<span class="n">${count(l.id)}</span></button>`
    + (v === l.id ? `<button class="tab-edit" data-edit="${esc(l.id)}" aria-label="Modifier l’onglet ${esc(l.name)}" title="Renommer ou changer la couleur">${ICON.pencil}</button>` : '')
  ).join('')
  ;
  const all = $('#allTab');
  all.setAttribute('aria-pressed', v === 'all'); all.setAttribute('aria-selected', v === 'all');
  all.innerHTML = `Vue globale<span class="n">${count('all')}</span>`;
  const act = $('.tab[aria-selected="true"]', tabs);
  if (act){ const l = act.offsetLeft - tabs.offsetLeft, r = l + act.offsetWidth + 44; if (l < tabs.scrollLeft) tabs.scrollLeft = l - 8; else if (r > tabs.scrollLeft + tabs.clientWidth) tabs.scrollLeft = r - tabs.clientWidth + 8; }
  updateTabFade();
}
function updateTabFade(){
  const t = $('#tabs');
  t.classList.toggle('fade-l', t.scrollLeft > 2);
  t.classList.toggle('fade-r', t.scrollLeft + t.clientWidth < t.scrollWidth - 2);
}

function noteHTML(t){
  const parts = [];
  const l = listOf(t.listId);
  if (state.settings.view === 'all') parts.push(`<span class="tag">${esc(l.name)}</span>`);
  const li = levelIdx(t.level);
  if (li >= 0) parts.push(`<span class="lvl" title="Note ${li + 1}"><b>${li + 1}</b>${esc(state.settings.scale[li].label)}</span>`);
  if (t.deadline){
    const d = daysUntil(t.deadline);
    let txt, cls = '';
    if (d < 0){ txt = `En retard de ${-d} j`; cls = 'late'; }
    else if (d === 0){ txt = 'Aujourd’hui'; cls = 'today'; }
    else if (d === 1) txt = 'Demain';
    else txt = fmtShort(t.deadline);
    if (t.done){ txt = fmtShort(t.deadline); cls = ''; }   // tâche barrée : plus de retard
    parts.push(`<span class="due ${cls}" title="Échéance : ${esc(fmtDateLong(t.deadline))}">${ICON.cal}${txt}</span>`);
    if (!t.done){
      if (t.urgency === 'auto' && autoUrgent(t)) parts.push(`<span class="auto" title="Passée en urgent automatiquement : l’échéance approche">${ICON.bolt}Auto</span>`);
      else if (t.urgency === 'off' && autoUrgent(t)) parts.push(`<span class="forced" title="Urgence automatique désactivée pour cette tâche">pas urgente</span>`);
      else if (t.urgency === 'auto' && !isUrgent(t)) parts.push(`<span class="soon">urgent dans ${d - leadOf(t)} j</span>`);
    }
  }
  if (t.notes.trim()) parts.push(`<span class="hasnotes" title="Contient des détails">${ICON.note}</span>`);
  const paper = paperOf(t), ink = inkFor(paper);
  return `<li class="note${t.done ? ' done' : ''}${ink !== '#2B2416' ? ' darkpaper' : ''}" data-id="${esc(t.id)}" style="--paper:${paper};--paper-ink:${ink};--rot:${rotOf(t.id)}deg;--pin:${l.color}">`
    + `<i class="pin" title="${esc(l.name)}"></i>`
    + `<div class="ntop"><button class="check" role="checkbox" aria-checked="${t.done}" aria-label="${t.done ? 'Débarrer' : 'Barrer'} ${esc(t.title)}">${ICON.check}</button>`
    + `<button class="nbody" title="Modifier. Glisser pour déplacer (Alt + flèches au clavier)"><span class="ntitle">${esc(t.title)}</span></button></div>`
    + `<span class="meta">${parts.join('')}</span>`
    + (t.done ? `<button class="ndel" aria-label="Supprimer ${esc(t.title)}" title="Supprimer">${ICON.trash}</button>` : '')
    + `</li>`;
}

function renderBoard(){
  const active = sortedActive();
  const done = state.tasks.filter(t => t.done && inView(t)).sort((a, b) => (a.doneAt || 0) - (b.doneAt || 0));
  const by = {q1:[], q2:[], q3:[], q4:[]}, byDone = {q1:[], q2:[], q3:[], q4:[]};
  active.forEach(t => by[quadOf(t)].push(t));
  done.forEach(t => byDone[quadOf(t)].push(t));
  const board = $('#board');
  const ae = document.activeElement;
  const focusQ = ae && ae.closest && ae.closest('.qadd') ? ae.closest('.qadd').dataset.q : null;
  const all = state.settings.view === 'all';
  const lastList = state.settings.lastList;
  board.innerHTML = QS.map(q => {
    const c = state.settings.quadrants[q];
    return `<section class="quad" data-q="${q}" id="quad-${q}" aria-label="${esc(c.name)}">`
      + `<div class="qhead"><div><h2 class="qname">${esc(c.name)}</h2><span class="qsub">${esc(c.sub)}</span></div><span class="qcount" title="Tâches en cours">${by[q].length || ''}</span></div>`
      + `<ul class="qlist" data-q="${q}" data-empty="${esc(EMPTY[q])}">${by[q].map(noteHTML).join('')}${byDone[q].map(noteHTML).join('')}</ul>`
      + `<form class="qadd" data-q="${q}" autocomplete="off"><input name="t" placeholder="Ajouter une tâche" aria-label="Ajouter une tâche dans ${esc(c.name)}" enterkeyhint="done">`
      + (all && state.lists.length > 1 ? `<select name="list" aria-label="Onglet">${state.lists.map(l => `<option value="${esc(l.id)}" ${l.id === lastList ? 'selected' : ''}>${esc(l.name)}</option>`).join('')}</select>` : '')
      + `<button aria-label="Ajouter">${ICON.plus}</button></form></section>`;
  }).join('');
  if (focusQ) $(`.qadd[data-q="${focusQ}"] input`).focus();
}

function renderMini(){
  const tasks = sortedActive();
  $('#mini').innerHTML = QS.map(q => `<button class="mini-cell" data-q="${q}"><b>${esc(qName(q))}</b><span>${tasks.filter(t => quadOf(t) === q).length}</span></button>`).join('');
}

function renderBelow(){
  const n = state.tasks.filter(t => t.done && inView(t)).length;
  $('#below').innerHTML = n ? `<button class="clear" id="clearDone">Supprimer les tâches barrées (${n})</button>` : '';
}

function measureHead(){
  const st = $('#stick');
  const sticky = getComputedStyle(st).position === 'sticky';
  document.documentElement.style.setProperty('--head-h', sticky ? st.offsetHeight + 'px' : '0px');
  updateTabFade();
}

/* ================= Actions ================= */
function setView(v){ state.settings.view = v; if (v !== 'all') state.settings.lastList = v; save(); render(); }

function createTask(data){
  const t = {id:uid(), title:'', notes:'', important:true, urgency:'auto', level:null, deadline:null, done:false, doneAt:null, createdAt:Date.now(), ...data};
  t.order = maxOf(state.tasks, 'order') + 1;
  state.tasks.push(t);
  return t;
}

/* Barrer / débarrer : l'ordre est conservé, la tâche reprend sa place en étant débarrée */
function toggleDone(id){
  const t = find(id); if (!t) return;
  t.done = !t.done; t.doneAt = t.done ? Date.now() : null;
  save(); render();
  const c = $(`.note[data-id="${CSS.escape(id)}"] .check`); if (c) c.focus();
}

function removeTask(id){
  const t = find(id); if (!t) return;
  state.tasks = state.tasks.filter(x => x.id !== id);
  save(); render();
  offerUndo('Tâche supprimée', () => putBack([t]));
}

/* Déplacer une tâche dans une case, à une position donnée */
function applyMove(id, q, index){
  const t = find(id); if (!t) return;
  const before = {important:t.important, urgency:t.urgency, order:t.order};
  const wasQ = quadOf(t);
  t.important = (q === 'q1' || q === 'q2');
  const wantUrgent = (q === 'q1' || q === 'q3');
  const prevUrg = t.urgency;
  if (wantUrgent) t.urgency = autoUrgent(t) ? 'auto' : 'on';
  else t.urgency = autoUrgent(t) ? 'off' : 'auto';
  const finalQ = quadOf(t);
  // un seul ordre pour toutes les vues : on place la tâche entre ses voisines visibles
  const list = sortedActive().filter(x => x.id !== id && quadOf(x) === finalQ);
  const idx = Math.max(0, Math.min(index, list.length));
  const prev = list[idx - 1], next = list[idx];
  t.order = prev && next ? (prev.order + next.order) / 2 : prev ? prev.order + .5 : next ? next.order - .5 : t.order;
  renumber();
  save(); render();
  if (t.urgency === 'off' && prevUrg !== 'off' && wasQ !== finalQ) offerUndo('Urgence automatique désactivée pour cette tâche', () => { const x = find(id); if (x) Object.assign(x, before); });
}

function nudge(id, dir){
  const t = find(id); if (!t || t.done) return;
  const q = quadOf(t);
  const list = sortedActive().filter(x => quadOf(x) === q);
  const i = list.indexOf(t), j = i + dir;
  if (j < 0 || j >= list.length) return;
  applyMove(id, q, j);
  const b = $(`.note[data-id="${CSS.escape(id)}"] .nbody`); if (b) b.focus();
}

/* ================= Glisser-déposer =================
   Souris : on attrape le pense-bête et on bouge de quelques pixels.
   Tactile : appui long (environ 0,4 s), puis on glisse. */
let drag = null, pendingMouse = null, pendingTouch = null;
const canDrag = (target) => { const li = target.closest('.note'); return li && !li.classList.contains('done') && !target.closest('.check, .ndel') ? li : null; };

boardEl.addEventListener('pointerdown', e => {
  if (e.pointerType === 'touch' || e.button !== 0) return;
  const li = canDrag(e.target); if (!li) return;
  pendingMouse = {li, x:e.clientX, y:e.clientY};
});
window.addEventListener('pointermove', e => {
  if (e.pointerType === 'touch') return;
  if (pendingMouse && !drag && Math.hypot(e.clientX - pendingMouse.x, e.clientY - pendingMouse.y) > 6){
    startDrag(pendingMouse.li, pendingMouse.x, pendingMouse.y); pendingMouse = null;
  }
  if (drag){ e.preventDefault(); moveDrag(e.clientX, e.clientY); }
});
window.addEventListener('pointerup', e => {
  if (e.pointerType === 'touch') return;
  pendingMouse = null;
  if (drag){ suppressClick = true; setTimeout(() => suppressClick = false, 50); endDrag(); }
});

boardEl.addEventListener('touchstart', e => {
  if (e.touches.length !== 1) return;
  const li = canDrag(e.target); if (!li) return;
  const p = e.touches[0];
  pendingTouch = {li, x:p.clientX, y:p.clientY, timer:setTimeout(() => {
    if (!pendingTouch) return;
    try { navigator.vibrate && navigator.vibrate(12); } catch(_){}
    startDrag(pendingTouch.li, pendingTouch.x, pendingTouch.y);
  }, 500)};
}, {passive:true});
document.addEventListener('touchmove', e => {
  const p = e.touches[0];
  if (drag){ e.preventDefault(); moveDrag(p.clientX, p.clientY); return; }
  if (pendingTouch && Math.hypot(p.clientX - pendingTouch.x, p.clientY - pendingTouch.y) > 10){ clearTimeout(pendingTouch.timer); pendingTouch = null; }
}, {passive:false});
const touchEnd = e => {
  if (pendingTouch){ clearTimeout(pendingTouch.timer); pendingTouch = null; }
  if (drag){ e.preventDefault(); suppressClick = true; setTimeout(() => suppressClick = false, 400); endDrag(); }
};
document.addEventListener('touchend', touchEnd, {passive:false});
document.addEventListener('touchcancel', () => { if (pendingTouch){ clearTimeout(pendingTouch.timer); pendingTouch = null; } if (drag) cancelDrag(); });
document.addEventListener('keydown', e => { if (e.key === 'Escape' && drag) cancelDrag(); });

function startDrag(li, x, y){
  const r = li.getBoundingClientRect();
  const ghost = li.cloneNode(true);
  ghost.classList.add('ghost');
  ghost.style.width = li.offsetWidth + 'px';
  ghost.style.height = li.offsetHeight + 'px';
  ghost.style.left = r.left + 'px';
  ghost.style.top = r.top + 'px';
  ghost.style.setProperty('--qc', getComputedStyle(li).getPropertyValue('--qc'));
  document.body.appendChild(ghost);
  li.classList.add('placeholder');
  const homeList = li.parentElement; const homeMin = homeList.style.minHeight; homeList.style.minHeight = homeList.offsetHeight + 'px';
  drag = {homeMin,id:li.dataset.id, li, ghost, dx:x - r.left, dy:y - r.top, x, y, mini:null, raf:0, valid:true, home:li.parentElement, homeNext:li.nextElementSibling};
  document.body.classList.add('dragging');
  drag.raf = requestAnimationFrame(autoScroll);
}
function moveDrag(x, y){
  drag.x = x; drag.y = y;
  drag.ghost.style.left = (x - drag.dx) + 'px';
  drag.ghost.style.top = (y - drag.dy) + 'px';
  updateTarget();
}
function updateTarget(){
  const el = document.elementFromPoint(drag.x, drag.y);
  $$('.over').forEach(n => n.classList.remove('over'));
  const mini = el && el.closest('.mini-cell');
  if (mini){ drag.mini = mini.dataset.q; mini.classList.add('over'); return; }
  drag.mini = null;
  const quad = el && el.closest('.quad');
  if (!quad){   // hors du tableau : la tâche revient à sa place, le lâcher annulera
    drag.valid = false;
    if (drag.li.parentElement !== drag.home || drag.li.nextElementSibling !== drag.homeNext) drag.home.insertBefore(drag.li, drag.homeNext);
    return;
  }
  drag.valid = true;
  quad.classList.add('over');
  const list = $('.qlist', quad);
  const items = $$('.note:not(.placeholder):not(.done)', list);
  let before = null;
  for (const it of items){
    const r = it.getBoundingClientRect();
    if (drag.y < r.top) { before = it; break; }                           // rangée au-dessus
    if (drag.y <= r.bottom && drag.x < r.left + r.width / 2) { before = it; break; } // même rangée, moitié gauche
  }
  if (!before) before = $('.note.done', list); // les tâches barrées restent en bas
  if (before){ if (before !== drag.li && before.previousElementSibling !== drag.li) list.insertBefore(drag.li, before); }
  else if (list.lastElementChild !== drag.li) list.appendChild(drag.li);
}
function autoScroll(){
  if (!drag) return;
  const top = getComputedStyle($('#stick')).position === 'sticky' ? $('#stick').getBoundingClientRect().bottom : 0;
  const edge = 70, vh = window.innerHeight;
  let dy = 0;
  if (drag.y < top + edge && drag.y > top) dy = -Math.ceil((top + edge - drag.y) / 5);
  else if (drag.y > vh - edge) dy = Math.ceil((drag.y - (vh - edge)) / 5);
  if (dy){ window.scrollBy(0, dy); updateTarget(); }
  drag.raf = requestAnimationFrame(autoScroll);
}
function cleanupDrag(){
  cancelAnimationFrame(drag.raf);
  drag.ghost.remove();
  drag.li.classList.remove('placeholder');
  drag.home.style.minHeight = drag.homeMin || '';
  $$('.over').forEach(n => n.classList.remove('over'));
  document.body.classList.remove('dragging');
}
function endDrag(){
  if (!drag) return;
  const {id, li, mini} = drag;
  if (!mini && !drag.valid){ cancelDrag(); return; }
  let q, index;
  if (mini){ q = mini; index = Infinity; }
  else {
    const list = li.parentElement;
    q = list.dataset.q;
    index = $$('.note:not(.done)', list).indexOf(li);
  }
  cleanupDrag(); drag = null; renderPending = false;
  applyMove(id, q, index);
}
function cancelDrag(){ if (!drag) return; cleanupDrag(); drag = null; renderPending = false; render(); }

const validDue = v => /^\d{4}-\d{2}-\d{2}$/.test(v) && +v.slice(0, 4) >= 2000 && +v.slice(0, 4) <= 2099;

function updatePreview(){
  const t = formTask();
  const q = quadOf(t), lead = leadOf(t), li = levelIdx(t.level);
  const when = lead === 0 ? 'le jour de l’échéance' : `${jours(lead)} avant l’échéance`;

  let hint;

  else if (t.urgency === 'off') hint = 'Ne passera pas en urgent, même à l’approche de l’échéance.';
  else if (!t.deadline) hint = 'Sans échéance, elle ne deviendra pas urgente toute seule.';
  else {
    const d = daysUntil(t.deadline);
    if (d <= lead) hint = d < 0 ? 'Échéance dépassée : urgente automatiquement.' : d === 0 ? 'Urgente automatiquement : échéance aujourd’hui.' : d === 1 ? 'Urgente automatiquement : échéance demain.' : `Urgente automatiquement : échéance le ${fmtDateLong(t.deadline)}`;
    else hint = lead > 0 ? `Passera en urgent le ${fmtDateLong(addDays(t.deadline, -lead))}, ${jours(lead)} avant l’échéance.` : 'Passera en urgent le jour de l’échéance.';
  }
  $('#preview').style.setProperty('--qc', `var(--${q})`);
  $('#preview').innerHTML = `<div class="pgrid" aria-hidden="true">${QS.map(x => `<i class="${x === q ? 'on' : ''}"></i>`).join('')}</div><div class="ptext">Ira dans <strong>${esc(qName(q))}</strong>. ${hint}</div>`;
}

/* le message se place dans la fenêtre au premier plan (sinon il resterait dessous, non cliquable) */

setBody.addEventListener('click', async e => {

/* ================= Synchronisation (Firebase) =================
   Les tâches restent d'abord dans le navigateur : l'outil marche hors ligne et sans compte.
   Connecté, chaque appareil envoie ses changements et reçoit ceux des autres ; les deux versions
   sont fusionnées tâche par tâche (la modification la plus récente l'emporte, les suppressions sont respectées). */
const sync = {attempt:0, status:'off', user:null, fb:null, unsub:null, timer:0, pushing:false, again:false, lastPushed:'', lastSync:0, err:''};

function mergeStates(L, R){

  const pick = (a, b, d) => {

    return [...m.values()].filter(x => !(d[x.id] && d[x.id] >= (x.updatedAt || 0)));

    if (setDlg.open && !setBody.contains(document.activeElement)) buildSettings();

}

async function authAction(act){

      mergedObj = syncable(merged);
      const payload = JSON.stringify(mergedObj);
      sync.lastPushed = payload;
      if (snap.exists() && snap.data().state === payload) return;
      tx.set(ref, {state:payload, updatedAt:f.serverTimestamp(), app:'matrice-eisenhower'});
    })]);
    if (sync.user !== user || attempt !== sync.attempt) return;
    if (mergedObj) adopt(mergedObj);
    clearTimeout(sync.retry);
    sync.lastSync = Date.now(); setStatus('ok');
  } catch(e){
    if (attempt !== sync.attempt) return;
    sync.lastPushed = '';
    setStatus(navigator.onLine === false || e.code === 'unavailable' ? 'offline' : 'error', e);
    clearTimeout(sync.retry); sync.retry = setTimeout(pushNow, navigator.onLine === false ? 15000 : 8000);
  } finally {
    if (attempt !== sync.attempt) return;
    sync.pushing = false;
    if (sync.again){ sync.again = false; schedulePush(300); }
  }
}
function onUser(user){
  const changed = (sync.user && sync.user.uid) !== (user && user.uid);
  sync.user = user || null;
  if (sync.unsub){ sync.unsub(); sync.unsub = null; }
  if (!user){ setStatus('signedout'); if (changed && setDlg.open) buildSettings(); return; }
  const f = sync.fb, ref = f.doc(f.db, 'users', user.uid);
  setStatus('syncing');
  sync.unsub = f.onSnapshot(ref, {includeMetadataChanges:false}, snap => {
    if (snap.metadata.hasPendingWrites || snap.metadata.fromCache) return;
    if (!snap.exists() || snap.data().state !== sync.lastPushed) schedulePush(0);
    else { sync.lastSync = Date.now(); setStatus('ok'); }
  }, err => { setStatus('error', err); });
  schedulePush(0);
  if (changed){ if (setDlg.open) buildSettings(); toast(`Connecté : ${user.email}. Vos tâches sont synchronisées.`); }
}
async function initSync(){
  if (!FIREBASE_CONFIG) return;
  setStatus('connecting');
  try {
    const base = `https://www.gstatic.com/firebasejs/${FB_VER}/`;
    const [appM, authM, fsM] = await Promise.all(['app', 'auth', 'firestore'].map(n => import(base + `firebase-${n}.js`)));
    const app = appM.initializeApp(FIREBASE_CONFIG);
    const auth = authM.getAuth(app); auth.languageCode = 'fr';
    const db = fsM.getFirestore(app);
    sync.fb = {...authM, ...fsM, auth, db};
    let first = true;
    authM.onAuthStateChanged(auth, user => { if (first){ first = false; sync.user = user; onUser(user); sync.firstDone = true; } else onUser(user); if (setDlg.open && !setBody.contains(document.activeElement)) buildSettings(); });
  } catch(e){
    setStatus('unavailable', e);
    setTimeout(initSync, 30000);
  }
}
$('#syncBtn').addEventListener('click', () => openSettings('sync'));
async function reconnect(){
  const f = sync.fb; if (!f || !sync.user) return;
  try { await f.disableNetwork(f.db); await f.enableNetwork(f.db); } catch(_){}
  if (sync.pushing){ sync.attempt++; sync.pushing = false; }   // l'envoi en attente est abandonné, on en relance un neuf
  schedulePush(0);
}
window.addEventListener('online', () => { if (sync.user) reconnect(); else if (FIREBASE_CONFIG && !sync.fb) initSync(); });
window.addEventListener('offline', () => { if (sync.user) setStatus('offline'); });
document.addEventListener('visibilitychange', () => { if (!document.hidden && sync.user) schedulePush(0); });

render();
initSync();
})();
</script>
</body>
</html>
